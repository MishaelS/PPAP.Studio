name: ppap-studio

services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      DATABASE_URL: postgres://ppap:${POSTGRES_PASSWORD:-ppap}@db:5432/ppap
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ppap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ppap}
      POSTGRES_DB: ppap
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppap -d ppap"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  web_node_modules:
  db_data:
